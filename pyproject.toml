[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radixview"
dynamic = ["version"]
description = "Watch prefix sharing and eviction in a live SGLang KV cache, rendered as a radix tree from the server's ZMQ events."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "sglang",
  "kv-cache",
  "prefix-caching",
  "radix-tree",
  "llm",
  "visualization",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [{ name = "RadixView Authors" }]
# Keep dependency names sorted alphabetically.
dependencies = [
  "msgspec",
  "pyzmq>=25.1.2",
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/ClaudeLiang/RadixView"
Repository = "https://github.com/ClaudeLiang/RadixView"
Issues = "https://github.com/ClaudeLiang/RadixView/issues"

[project.scripts]
radixview = "radixview.cli:main"

[tool.setuptools.dynamic]
version = { attr = "radixview.version.__version__" }

[tool.setuptools.packages.find]
include = ["radixview*"]

[tool.setuptools.package-data]
radixview = ["web/*.css", "web/*.html", "web/js/*.mjs"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F401", "F821", "F823", "UP037", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 9

[tool.isort]
profile = "black"
known_first_party = ["examples", "radixview"]
