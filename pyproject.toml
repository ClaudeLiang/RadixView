[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radixview"
dynamic = ["version"]
description = "SGLang sidecar that logs KV-cache events from a running server."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
# Keep dependency names sorted alphabetically.
dependencies = [
  "msgspec",
  "pyzmq>=25.1.2",
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "ruff",
]

[project.scripts]
radixview = "radixview.cli:main"

[tool.setuptools.dynamic]
version = { attr = "radixview.version.__version__" }

[tool.setuptools.packages.find]
include = ["radixview*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F401", "F821", "F823", "UP037", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.isort]
profile = "black"
known_first_party = ["radixview"]
